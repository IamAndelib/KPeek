#
# Builds the KPeek Flatpak bundle attached to GitHub releases (scripts/build-flatpak.sh).
# This is not the Flathub manifest: Flathub's is maintained separately in its own repository.
id: io.github.iamandelib.kpeek
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: kpeek
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering and VA-API video decoding.
  - --device=dri
  - --socket=pulseaudio
  # Previews any file the user selects, and steps through its folder: read-only access to it all.
  - --filesystem=host:ro
  # Dolphin's thumbnails, shown instantly while previews load.
  - --filesystem=xdg-cache/thumbnails:ro
  # The user's Plasma colour scheme and fonts.
  - --filesystem=xdg-config/kdeglobals:ro
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
modules:
  # Encoding data Poppler needs for CJK and other non-Latin PDFs.
  - name: poppler-data
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  # PDF rendering; not part of the KDE runtime. Only the Qt 6 library is built.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=ON
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35

  - name: kpeek
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-asan
          - build-clazy
          - build-rel
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
